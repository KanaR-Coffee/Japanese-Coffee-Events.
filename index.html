<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewSync Japan | 日本全国珈琲イベント一覧</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans JP', sans-serif; background-color: #FDFBF7; color: #2C221E; }</style>
</head>
<body class="min-h-screen flex flex-col bg-[#FDFBF7] text-[#2C221E]">
    <header class="bg-[#2C221E] text-[#FDFBF7] sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded bg-[#C86D51] flex items-center justify-center font-bold text-white">B</div>
                <span class="font-bold text-lg tracking-wide">BrewSync Japan</span>
            </div>
            <button onclick="triggerSync()" class="bg-[#C86D51] text-white px-4 py-1.5 rounded-lg text-xs font-medium cursor-pointer">同期</button>
        </div>
    </header>

    <section class="bg-[#3D312C] text-[#FDFBF7] py-8 px-4 text-center">
        <div class="max-w-3xl mx-auto space-y-3">
            <h1 class="text-2xl md:text-3xl font-bold">日本中の極上な珈琲体験と出会う</h1>
            <div class="bg-[#2C221E] p-3 rounded-2xl shadow-lg mt-4">
                <input type="text" id="search-input" placeholder="イベント名や地域で検索..." oninput="renderEvents()"
                    class="w-full bg-[#3D312C] text-white placeholder-[#9C8A82] text-sm px-4 py-2.5 rounded-xl focus:outline-none">
            </div>
        </div>
    </section>

    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">
