<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewSync Japan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FDFBF7] text-[#2C221E] p-4">
    <header class="max-w-xl mx-auto mb-6">
        <h1 class="text-2xl font-bold">☕ 日本全国珈琲イベント</h1>
        <p class="text-xs text-gray-600 mt-1">自動同期システム稼働中</p>
    </header>

    <main id="event-list" class="max-w-xl mx-auto space-y-4">
        <!-- ここにイベントが表示されます -->
    </main>

    <script>
        const events = [
            { title: "TOKYO COFFEE FESTIVAL 2026", date: "2026/12/12", place: "東京都渋谷区（国連大学中庭）" },
            { title: "KYOTO ROASTERS MARKET", date: "2026/11/28", place: "京都市左京区（岡崎公園）" },
            { title: "FUKUOKA COFFEE WEEKEND", date: "2026/12/05", place: "福岡市中央区（天神中央公園）" }
        ];

        const list = document.getElementById('event-list');
        events.forEach(ev => {
            list.innerHTML += `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-orange-100">
                    <h2 class="font-bold text-lg text-orange-900">${ev.title}</h2>
                    <p class="text-xs text-orange-600 font-semibold mt-1">📅 ${ev.date}</p>
                    <p class="text-xs text-gray-600 mt-1">📍 ${ev.place}</p>
                </div>
            `;
        });
    </script>
</body>
</html>
