name: Daily Coffee Events Update

on:
  schedule:
    # 毎日日本時間の朝4時に自動実行（UTC 19:00）
    - cron: '0 19 * * *'
  workflow_dispatch: # 手動でいつでも実行できるボタン

jobs:
  update-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run automated update script
        run: |
          python update_events.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [Automated] Daily coffee events sync completed"
          file_pattern: "events.json"
          branch: main
